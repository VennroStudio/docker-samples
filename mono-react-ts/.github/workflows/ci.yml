name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_API_URL: https://api.example.test/v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Use repository npm version
        run: npm install --global npm@10.9.8

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run check-types

      - name: Check code and FSD boundaries
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build Web application
        run: npm run build:web

      - name: Build Admin application
        run: npm run build:admin

      - name: Check bundle budgets
        run: npm run check:bundle
